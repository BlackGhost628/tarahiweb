<!DOCTYPE html>
<html lang="fa">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>سبد خرید - FoodEase</title>
<link rel="stylesheet" href="../css/style.css">
</head>

<body class="light">

<header class="site-header">
  <div class="logo">
    <img src="../image/logo.png" alt="FoodEase Logo">
  </div>

  <nav class="main-menu">
    <ul>
      <li><a href="index.html">صفحه اصلی</a></li>
      <li><a href="products.html">منوی غذا</a></li>
      <li><a href="cart.html" class="active">سبد خرید</a></li>
      <li><a href="ma.html">درباره ما</a></li>
      <li><a href="contact.html">تماس با ما</a></li>
    </ul>
  </nav>
</header>

<main>

<section class="md-card md-card-elevated"
         style="max-width:1000px;margin:40px auto;padding:24px;">

  <h2 style="text-align:center;margin-bottom:24px;">
    🛒 سبد خرید شما
  </h2>

  <!-- پیام سبد خالی -->
  <p id="emptyCart"
     style="text-align:center;display:none;">
    سبد خرید شما خالی است
  </p>

  <div class="table-wrapper">
    <table class="md-table" id="cartTable">
      <thead>
        <tr>
          <th>تصویر</th>
          <th>محصول</th>
          <th>قیمت واحد</th>
          <th>تعداد</th>
          <th>قیمت کل</th>
          <th>عملیات</th>
        </tr>
      </thead>

      <tbody>
        <tr data-price="150000">
          <td><img src="../image/pizza.jpg" class="thumb"></td>
          <td>پیتزا مخصوص</td>
          <td>150,000</td>
          <td>
            <input type="number"
                   value="1"
                   min="1"
                   onchange="updateRow(this)">
          </td>
          <td class="row-total">150,000</td>
          <td>
            <button class="md-btn md-text md-sm"
                    onclick="removeRow(this)">
              حذف
            </button>
          </td>
        </tr>

        <tr data-price="120000">
          <td><img src="../image/kabbab.jpg" class="thumb"></td>
          <td>کباب ایرانی</td>
          <td>120,000</td>
          <td>
            <input type="number"
                   value="2"
                   min="1"
                   onchange="updateRow(this)">
          </td>
          <td class="row-total">240,000</td>
          <td>
            <button class="md-btn md-text md-sm"
                    onclick="removeRow(this)">
              حذف
            </button>
          </td>
        </tr>
      </tbody>

      <tfoot>
        <tr>
          <td colspan="4" style="text-align:right;font-weight:bold;">
            جمع کل
          </td>
          <td colspan="2" id="cartTotal"
              style="font-weight:bold;">
            390,000 تومان
          </td>
        </tr>
      </tfoot>
    </table>
  </div>

  <div style="display:flex;
              justify-content:space-between;
              margin-top:32px;
              flex-wrap:wrap;
              gap:12px;">

    <a href="products.html"
       class="md-btn md-outlined md-md">
      ← ادامه خرید
    </a>

    <button id="checkoutBtn"
            class="md-btn md-filled md-md md-round">
      ادامه پرداخت
    </button>
  </div>

</section>

</main>

<footer class="site-footer">
  © 2025 FoodEase
</footer>

<!-- ================= JavaScript ================= -->
<script>
  const cartTable = document.getElementById('cartTable');
  const totalEl = document.getElementById('cartTotal');
  const emptyMsg = document.getElementById('emptyCart');
  const checkoutBtn = document.getElementById('checkoutBtn');

  function updateRow(input) {
    const row = input.closest('tr');
    const price = Number(row.dataset.price);
    const qty = Number(input.value);
    const rowTotal = price * qty;

    row.querySelector('.row-total').textContent =
      rowTotal.toLocaleString();

    updateCartTotal();
  }

  function removeRow(btn) {
    btn.closest('tr').remove();
    updateCartTotal();
  }

  function updateCartTotal() {
    const rows = cartTable.querySelectorAll('tbody tr');
    let sum = 0;

    rows.forEach(row => {
      const qty = row.querySelector('input').value;
      const price = row.dataset.price;
      sum += qty * price;
    });

    if (rows.length === 0) {
      emptyMsg.style.display = 'block';
      cartTable.style.display = 'none';
      checkoutBtn.disabled = true;
      checkoutBtn.textContent = 'سبد خالی است';
      return;
    }

    totalEl.textContent = sum.toLocaleString() + ' تومان';
  }

  updateCartTotal();
</script>

</body>
</html>
